# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
#

# Name as fc-list reports it; the "Mono" variant has uniform cell widths
# which keeps powerline arrows + nerd icons aligned. The bold/italic variants
# share the same family — kitty derives them automatically.
font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14

background_opacity 0.7
