# Onboarding configuration. Sourced as bash by scripts/onboarding.sh, and
# tracked in git so a fresh clone gets the same behaviour.
#
# Every setting here can be overridden for a single run with an environment
# variable, so you never have to edit and revert this file for a one-off.

# ─── Git forges probed for working SSH auth (step 1) ────────────────────────
# Space-separated hostnames. Onboarding tries each in turn and stops at the
# first one that accepts the key — it only needs proof the key is registered
# somewhere. A forge listed here that you don't actually use costs a network
# round trip on every sync and puts its name in the setup prompts.
#
#   GIT_FORGES="github.com gitlab.com"   # the built-in default
#   GIT_FORGES="github.com"              # GitHub only; never contacts GitLab
#   GIT_FORGES="github.com git.example"  # add a self-hosted instance
#   GIT_FORGES=""                        # skip the SSH-key step entirely
#
# One-off override: DCLI_ONBOARDING_GIT_FORGES="github.com" dcli sync
GIT_FORGES="github.com"
